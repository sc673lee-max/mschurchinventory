<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>명선교회 교회학교 물품 관리 시스템</title>
<!-- Pretendard Web Font -->
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
:root {
  /* Brand Emerald Palette */
  --primary-900: #0D3321;
  --primary-800: #1B4332;
  --primary-700: #2D6A4F;
  --primary-600: #40916C;
  --primary-500: #52B788;
  --primary-100: #E8F5EE;
  --primary-50:  #F2F9F5;

  /* Neutral Slate Palette */
  --bg-page: #F1F5F9;
  --surface: #FFFFFF;
  --surface-hover: #F8FAFC;
  --surface-alt: #F8FAFC;
  --line: #E2E8F0;
  --line-subtle: #F1F5F9;
  --text-main: #0F172A;
  --text-muted: #64748B;
  --text-subtle: #94A3B8;

  /* Functional Accents */
  --rose-600: #E11D48;
  --rose-100: #FFE4E6;
  --rose-50:  #FFF1F2;
  --amber-600: #D97706;
  --amber-100: #FEF3C7;
  --amber-50:  #FFFBEB;
  --blue-600: #2563EB;
  --blue-100: #DBEAFE;
  --blue-50:  #EFF6FF;

  /* Radius & Shadows */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.04);
  --shadow-card: 0 4px 16px -2px rgba(15, 23, 42, 0.05), 0 1px 3px 0 rgba(15, 23, 42, 0.03);
  --shadow-float: 0 12px 28px -4px rgba(15, 23, 42, 0.12), 0 4px 12px -2px rgba(15, 23, 42, 0.06);
  --shadow-modal: 0 24px 48px -12px rgba(15, 23, 42, 0.25);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background-color: var(--bg-page);
  color: var(--text-main);
  font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
  min-height: 100vh;
  display: flex;
  justify-content: center;
}

button, input, select, textarea {
  font-family: inherit;
  color: inherit;
}

/* App Container Layout */
#app {
  width: 100%;
  max-width: 640px;
  min-height: 100vh;
  background: var(--surface);
  display: flex;
  flex-direction: column;
  position: relative;
  box-shadow: 0 0 40px rgba(15, 23, 42, 0.06);
}

/* Top Navigation Bar */
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  padding: 16px 20px 14px;
}

.topbar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.brand-wrapper {
  display: flex;
  align-items: center;
  gap: 11px;
}

.brand-icon {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, var(--primary-700), var(--primary-800));
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(27, 67, 50, 0.2);
  flex-shrink: 0;
}

.brand-info h1 {
  font-size: 17px;
  font-weight: 700;
  color: var(--text-main);
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 6px;
}

.brand-badge {
  font-size: 11px;
  font-weight: 600;
  color: var(--primary-700);
  background: var(--primary-100);
  padding: 2px 7px;
  border-radius: var(--radius-full);
}

.brand-info .sub {
  font-size: 12.5px;
  color: var(--text-muted);
  margin-top: 1px;
}

/* Live Sync Pill */
.sync-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  font-weight: 500;
  padding: 4px 9px;
  border-radius: var(--radius-full);
  background: var(--surface-alt);
  border: 1px solid var(--line);
  color: var(--text-muted);
  transition: all 0.2s;
}

.sync-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--text-subtle);
}

.sync-badge.synced {
  background: var(--primary-50);
  border-color: rgba(64, 145, 108, 0.3);
  color: var(--primary-800);
}

.sync-badge.synced .sync-dot {
  background: #10B981;
  box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.25);
  animation: pulse-green 2s infinite;
}

.sync-badge.warning {
  background: var(--amber-50);
  border-color: rgba(217, 119, 6, 0.3);
  color: var(--amber-600);
}

.sync-badge.warning .sync-dot {
  background: var(--amber-600);
}

@keyframes pulse-green {
  0% { transform: scale(0.95); opacity: 0.8; }
  50% { transform: scale(1.15); opacity: 1; }
  100% { transform: scale(0.95); opacity: 0.8; }
}

/* Content Area */
main#content {
  flex: 1;
  padding: 20px 20px calc(85px + env(safe-area-inset-bottom));
  overflow-y: auto;
  background: var(--surface-alt);
}

/* Bottom Tab Navigation Bar */
.tabbar {
  position: sticky;
  bottom: 0;
  z-index: 30;
  display: flex;
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
  box-shadow: 0 -4px 16px rgba(15, 23, 42, 0.04);
}

.tab-btn {
  flex: 1;
  border: none;
  background: transparent;
  padding: 8px 4px 6px;
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  position: relative;
  border-radius: var(--radius-md);
  transition: all 0.18s ease;
}

.tab-btn:hover {
  color: var(--primary-700);
  background: rgba(45, 106, 79, 0.04);
}

.tab-btn .tab-icon {
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.18s ease;
}

.tab-btn .tab-label {
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: -0.01em;
}

.tab-btn.active {
  color: var(--primary-700);
}

.tab-btn.active .tab-icon {
  transform: translateY(-1px);
}

.tab-btn.active .tab-label {
  font-weight: 700;
}

.tab-btn .badge-count {
  position: absolute;
  top: 4px;
  right: calc(50% - 18px);
  background: var(--rose-600);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  min-width: 16px;
  height: 16px;
  border-radius: var(--radius-full);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
  border: 2px solid #fff;
}

/* Stat Grid (Dashboard) */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 14px;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.stat-card:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-card);
}

.stat-icon-wrapper {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.stat-icon-wrapper.green { background: var(--primary-100); color: var(--primary-700); }
.stat-icon-wrapper.blue  { background: var(--blue-100); color: var(--blue-600); }
.stat-icon-wrapper.amber { background: var(--amber-100); color: var(--amber-600); }
.stat-icon-wrapper.rose  { background: var(--rose-100); color: var(--rose-600); }

.stat-content {
  flex: 1;
  min-width: 0;
}

.stat-num {
  font-size: 23px;
  font-weight: 800;
  color: var(--text-main);
  letter-spacing: -0.02em;
  line-height: 1.1;
}

.stat-label {
  font-size: 12.5px;
  color: var(--text-muted);
  font-weight: 500;
  margin-top: 3px;
}

/* Section Header */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 24px 0 12px;
}

.section-header:first-child {
  margin-top: 0;
}

.section-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 8px;
  letter-spacing: -0.01em;
}

.section-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: var(--radius-full);
}

.section-badge.rose { background: var(--rose-100); color: var(--rose-600); }
.section-badge.amber { background: var(--amber-100); color: var(--amber-600); }
.section-badge.green { background: var(--primary-100); color: var(--primary-700); }

/* Quick Action Area */
.quick-action-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 24px;
}

.quick-action-col {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.quick-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 11px 14px;
  border-radius: var(--radius-md);
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-main);
  cursor: pointer;
  transition: all 0.15s ease;
  box-shadow: var(--shadow-sm);
}

.quick-btn:hover {
  background: var(--surface-hover);
  border-color: var(--primary-500);
  color: var(--primary-700);
}

.quick-btn.primary {
  background: var(--primary-700);
  border-color: var(--primary-700);
  color: #fff;
}

.quick-btn.primary:hover {
  background: var(--primary-800);
  border-color: var(--primary-800);
}

/* Location Button under Item Add */
.quick-btn.loc-btn {
  background: var(--surface);
  border: 1.5px dashed rgba(64, 145, 108, 0.45);
  color: var(--primary-800);
  font-size: 13px;
  padding: 10px 12px;
}

.quick-btn.loc-btn:hover {
  background: var(--primary-50);
  border-color: var(--primary-600);
  color: var(--primary-900);
  border-style: solid;
}

.quick-btn.loc-btn svg {
  color: var(--primary-600);
  flex-shrink: 0;
}

/* Loan/Usage Card Button */
.quick-btn.loan-card-btn {
  height: 100%;
  min-height: 94px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 12px 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  text-align: center;
}

.quick-btn.loan-card-btn:hover {
  background: #FFFBEB;
  border-color: var(--amber-500);
  color: var(--amber-700);
}

.quick-btn.loan-card-btn .loan-icon {
  color: #D97706;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s ease;
}

.quick-btn.loan-card-btn:hover .loan-icon {
  transform: translateY(-1px) scale(1.05);
}

.quick-btn.loan-card-btn .loan-title {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--text-main);
  line-height: 1.3;
}

.quick-btn.loan-card-btn:hover .loan-title {
  color: var(--amber-800);
}

.quick-btn.loan-card-btn .loan-sub {
  font-size: 11.5px;
  font-weight: 500;
  color: var(--text-muted);
}

@media (max-width: 360px) {
  .quick-btn {
    padding: 9px 8px;
    font-size: 12.5px;
  }
  .quick-btn.loc-btn {
    font-size: 12px;
  }
  .quick-btn.loan-card-btn .loan-title {
    font-size: 12.5px;
  }
  .quick-btn.loan-card-btn .loan-sub {
    font-size: 11px;
  }
}

/* Card Row Styles (Overdue / Active Loan) */
.card-row {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  box-shadow: var(--shadow-sm);
  transition: all 0.15s ease;
  position: relative;
  overflow: hidden;
}

.card-row:hover {
  box-shadow: var(--shadow-card);
}

.card-row::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: var(--line);
}

.card-row.overdue {
  background: var(--rose-50);
  border-color: rgba(225, 29, 72, 0.2);
}

.card-row.overdue::before {
  background: var(--rose-600);
}

.card-row.loan {
  border-color: rgba(64, 145, 108, 0.2);
}

.card-row.loan::before {
  background: var(--primary-600);
}

.card-row .info {
  flex: 1;
  min-width: 0;
}

.card-row .title {
  font-weight: 700;
  font-size: 15px;
  color: var(--text-main);
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-row .meta {
  font-size: 13px;
  color: var(--text-muted);
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.card-row .meta-item {
  display: flex;
  align-items: center;
  gap: 5px;
}

.badge-pill {
  font-size: 11.5px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: var(--radius-full);
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.badge-pill.danger {
  background: var(--rose-600);
  color: #fff;
}

.badge-pill.warning {
  background: var(--amber-50);
  border: 1px solid rgba(217, 119, 6, 0.3);
  color: var(--amber-600);
}

.badge-pill.soft {
  background: var(--primary-100);
  color: var(--primary-800);
}

.action-pill-btn {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--primary-700);
  font-size: 12.5px;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: var(--radius-full);
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
  box-shadow: var(--shadow-sm);
}

.action-pill-btn:hover {
  background: var(--primary-700);
  border-color: var(--primary-700);
  color: #fff;
}

.action-pill-btn.danger {
  color: var(--rose-600);
  border-color: rgba(225, 29, 72, 0.25);
  background: var(--rose-50);
}

.action-pill-btn.danger:hover {
  background: var(--rose-600);
  border-color: var(--rose-600);
  color: #fff;
}

.card-actions-col {
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: flex-end;
  flex-shrink: 0;
}

@media (min-width: 480px) {
  .card-actions-col {
    flex-direction: row;
    align-items: center;
  }
}

/* Empty State */
.empty-state {
  text-align: center;
  color: var(--text-muted);
  font-size: 13.5px;
  padding: 36px 16px;
  background: var(--surface);
  border: 1px dashed var(--line);
  border-radius: var(--radius-lg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.empty-state svg {
  color: var(--text-subtle);
  margin-bottom: 4px;
}

/* Search Bar & Category Chips */
.search-container {
  position: relative;
  margin-bottom: 12px;
}

.search-icon-svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
}

.searchbar {
  width: 100%;
  padding: 12px 14px 12px 42px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  font-size: 14.5px;
  background: var(--surface);
  color: var(--text-main);
  box-shadow: var(--shadow-sm);
  transition: all 0.2s ease;
}

.searchbar:focus {
  outline: none;
  border-color: var(--primary-600);
  box-shadow: 0 0 0 3px rgba(64, 145, 108, 0.15);
}

.category-chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 12px;
  scrollbar-width: none;
}

.category-chips::-webkit-scrollbar {
  display: none;
}

.chip {
  padding: 6px 13px;
  border-radius: var(--radius-full);
  font-size: 12.5px;
  font-weight: 600;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text-muted);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s ease;
}

.chip:hover {
  border-color: var(--primary-500);
  color: var(--primary-700);
}

.chip.active {
  background: var(--primary-700);
  border-color: var(--primary-700);
  color: #fff;
}

/* Item Row Cards */
.item-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  margin-bottom: 10px;
  cursor: pointer;
  display: flex;
  gap: 14px;
  align-items: center;
  box-shadow: var(--shadow-sm);
  transition: all 0.18s ease;
}

.item-card:hover {
  transform: translateY(-1px);
  border-color: rgba(64, 145, 108, 0.4);
  box-shadow: var(--shadow-card);
}

.item-thumb {
  width: 52px;
  height: 52px;
  border-radius: var(--radius-md);
  background: var(--primary-100);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  color: var(--primary-800);
  overflow: hidden;
  font-weight: 700;
  border: 1px solid rgba(64, 145, 108, 0.15);
}

.item-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.item-info {
  flex: 1;
  min-width: 0;
}

.item-title-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 3px;
}

.item-title {
  font-weight: 700;
  font-size: 15px;
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.item-category-tag {
  font-size: 11px;
  color: var(--text-muted);
  background: var(--surface-alt);
  border: 1px solid var(--line);
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  font-weight: 500;
}

.item-meta {
  font-size: 12.5px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
}

.item-stock-box {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  flex-shrink: 0;
}

.item-qty-badge {
  font-size: 13.5px;
  font-weight: 800;
  color: var(--primary-700);
  letter-spacing: -0.01em;
}

.item-qty-badge.low {
  color: var(--rose-600);
}

.stock-meter-bg {
  width: 50px;
  height: 4px;
  border-radius: var(--radius-full);
  background: var(--line);
  overflow: hidden;
}

.stock-meter-fill {
  height: 100%;
  border-radius: var(--radius-full);
  background: var(--primary-500);
}

.stock-meter-fill.low {
  background: var(--rose-600);
}

/* Floating Action Button (FAB) */
.fab {
  position: fixed;
  bottom: calc(82px + env(safe-area-inset-bottom));
  right: calc(50% - 300px);
  z-index: 25;
  background: var(--primary-700);
  color: #fff;
  border: none;
  border-radius: var(--radius-full);
  padding: 13px 20px;
  font-size: 14.5px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: var(--shadow-float);
  display: inline-flex;
  align-items: center;
  gap: 7px;
  transition: all 0.2s ease;
}

@media (max-width: 640px) {
  .fab {
    right: 20px;
  }
}

.fab:hover {
  background: var(--primary-800);
  transform: translateY(-2px);
  box-shadow: 0 16px 32px -4px rgba(27, 67, 50, 0.3);
}

/* Loans Segment Control */
.segment-tabs {
  display: flex;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 4px;
  margin-bottom: 16px;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
}

.segment-tabs::-webkit-scrollbar {
  display: none;
}

.segment-btn {
  flex: 1;

<script>
// ==========================================================================
// ⚠️ 관리자 설정: Firebase 프로젝트 설정값
// ==========================================================================
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCqY0eACy_09m4DDAkNlEb0FJ5nPa2NCG4",
  authDomain: "ms-inventory-13b12.firebaseapp.com",
  projectId: "ms-inventory-13b12",
  storageBucket: "ms-inventory-13b12.firebasestorage.app",
  messagingSenderId: "642887968372",
  appId: "1:642887968372:web:1e8c651ddb55a5899a5321"
};
// ==========================================================================

// ---------- State Management ----------
let state = { locations: [], items: [], transactions: [] };
let activeTab = 'home';
let itemsSearchQuery = '';
let itemsSelectedCategory = '';
let loansSegment = 'active'; // 'active' | 'overdue' | 'consumed' | 'lost'
let db = null;
let firebaseReady = false;

const content = document.getElementById('content');
const modalRoot = document.getElementById('modalRoot');
const pageSub = document.getElementById('pageSub');

// ---------- Utility Functions ----------
function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }
function fmtDate(d){
  if(!d) return '-';
  const dt = new Date(d);
  return (dt.getMonth()+1) + '월 ' + dt.getDate() + '일';
}
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.innerHTML = `
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#52B788" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 6 9 17l-5-5"/>
    </svg>
    <span>${escapeHtml(msg)}</span>
  `;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=> t.classList.remove('show'), 2200);
}

// ---------- Storage & Cloud Sync (Firebase Firestore) ----------
function isFirebaseConfigured(){
  return FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf('여기에') !== 0;
}

function initFirebase(){
  if(!isFirebaseConfigured()) return;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    firebaseReady = true;
  }catch(e){
    console.error('Firebase 초기화 오류:', e);
    firebaseReady = false;
  }
}

function updateSyncStatus(){
  const badge = document.getElementById('syncBadge');
  const text = document.getElementById('syncText');
  if(!badge || !text) return;
  if(firebaseReady){
    badge.className = 'sync-badge synced';
    text.textContent = '클라우드 동기화 중';
  } else {
    badge.className = 'sync-badge warning';
    text.textContent = '로컬 저장 모드';
  }
}

function startSync(){
  updateSyncStatus();
  try{
    const raw = localStorage.getItem('church-inventory-data');
    if(raw){
      const parsed = JSON.parse(raw);
      state.locations = parsed.locations || [];
      state.items = parsed.items || [];
      state.transactions = parsed.transactions || [];
    }
  }catch(e){}
  render();

  if(!firebaseReady) return;

  db.collection('church-inventory').doc('main').onSnapshot((doc) => {
    if(doc.exists){
      const data = doc.data();
      state.locations = data.locations || [];
      state.items = data.items || [];
      state.transactions = data.transactions || [];
      try{ localStorage.setItem('church-inventory-data', JSON.stringify(state)); }catch(e){}
    }
    render();
  }, (err) => {
    console.error('Firestore 실시간 동기화 오류:', err);
    showToast('서버 연결을 확인해주세요. 로컬 데이터를 유지합니다.');
  });
}

async function saveState(){
  if(!firebaseReady){
    try{
      localStorage.setItem('church-inventory-data', JSON.stringify(state));
    }catch(e){
      console.error('Local storage 저장 실패:', e);
      showToast('저장에 실패했어요.');
    }
    return;
  }
  try{
    await db.collection('church-inventory').doc('main').set(state);
  }catch(e){
    console.error('Firestore 저장 실패:', e);
    showToast('서버 저장에 실패했어요. 네트워크를 확인해주세요.');
  }
}

async function persistAndRender(){
  await saveState();
  render();
}

// ---------- Derived Data Helpers ----------
function getLocation(id){ return state.locations.find(l => l.id === id); }
function getItem(id){ return state.items.find(i => i.id === id); }
function itemCountAtLocation(locId){ return state.items.filter(i => i.locationId === locId).length; }

function activeLoans(){
  return state.transactions
    .filter(t => t.type === 'checkout' && !t.consumable && !t.returned)
    .sort((a,b) => (a.dueDate||'').localeCompare(b.dueDate||''));
}
function overdueLoans(){
  const today = todayStr();
  return activeLoans().filter(t => t.dueDate && t.dueDate < today);
}
function upcomingLoans(){
  const today = todayStr();
  return activeLoans().filter(t => {
    if(!t.dueDate || t.dueDate < today) return false;
    return daysBetween(today, t.dueDate) <= 3;
  });
}
function recentConsumables(){
  return state.transactions
    .filter(t => t.type === 'checkout' && t.consumable)
    .sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||''))
    .slice(0, 15);
}
function lostTransactions(){
  return state.transactions
    .filter(t => t.type === 'lost')
    .sort((a,b) => (b.date || b.createdAt || '').localeCompare(a.date || a.createdAt || ''));
}

// ---------- Image Compression Helper ----------
function fileToCompressedBase64(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---------- View Rendering ----------
function render(){
  // Update Tab bar UI
  document.querySelectorAll('#tabbar .tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === activeTab);
  });

  // Overdue badge on loans tab
  const overdueCount = overdueLoans().length;
  const loansBtn = document.getElementById('loansTabBtn');
  const existingBadge = loansBtn.querySelector('.badge-count');
  if(existingBadge) existingBadge.remove();
  if(overdueCount > 0){
    loansBtn.insertAdjacentHTML('beforeend', `<span class="badge-count">${overdueCount}</span>`);
  }

  if(activeTab === 'home'){
    pageSub.textContent = '보관 장소와 대여 현황을 한눈에 관리해요';
    renderHome();
  } else if(activeTab === 'items'){
    pageSub.textContent = '물품을 등록하고 위치와 재고를 확인해요';
    renderItems();
  } else if(activeTab === 'loans'){
    pageSub.textContent = '대여 물품의 반납 일정과 소모 내역을 관리해요';
    renderLoans();
  } else if(activeTab === 'locations'){
    pageSub.textContent = '교회학교 물품 보관 장소를 관리해요';
    renderLocations();
  }
}

  // Overdue Section
  html += `
  <div class="section-header">
    <div class="section-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E11D48" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>

  if(overdue.length === 0){
    html += `
    <div class="empty-state">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
      <div>연체된 물품이 없어요. 모든 반납이 정상 진행 중입니다!</div>

      const dOver = daysBetween(t.dueDate, todayStr());

              <span>·</span>
              <span>${escapeHtml(t.person || '담당자 미입력')}</span>
              <span>·</span>
              <strong>${t.qty}개</strong>
            </div>
            <div class="meta-item" style="color:var(--rose-600); font-weight:600;">

  if(upcoming.length > 0){

      html += `
      <div class="card-row loan">
        <div class="info">
          <div class="title">${escapeHtml(item ? item.name : '삭제된 물품')}</div>
          <div class="meta">
            <div class="meta-item">
              <span>${escapeHtml(t.dept || '부서')}</span>
              <span>·</span>
              <span>${escapeHtml(t.person || '담당자')}</span>
              <span>·</span>

            </div>
            <div class="meta-item">
              ${t.pickupDate ? `<span>픽업: ${fmtDate(t.pickupDate)}</span> <span>·</span> ` : ''}반납 예정일: ${fmtDate(t.dueDate)} (${daysText})

            <button class="action-pill-btn danger" onclick="openReportLostModal('${t.id}')">분실</button>
            <button class="action-pill-btn" style="color:var(--rose-600); border-color:rgba(225,29,72,0.35);" onclick="openDeleteLoanModal('${t.id}')">삭제</button>
          </div>
        </div>
      </div>`;
    });
  }

  content.innerHTML = html;
}

// ---------- 2. Items View ----------
function renderItems(){
  let html = '';

  // Search Bar
  html += `
  <div class="search-container">
    <svg class="search-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
    </svg>
    <input type="text" class="searchbar" placeholder="물품 이름 또는 카테고리로 검색" value="${escapeHtml(itemsSearchQuery)}" oninput="onItemsSearch(this.value)">
  </div>
  `;

  // Dynamically extract categories for chips
  const categoriesSet = new Set();
  state.items.forEach(i => {
    if(i.category && i.category.trim()) categoriesSet.add(i.category.trim());
  });
  const categories = Array.from(categoriesSet);

  if(categories.length > 0){
    html += '<div class="category-chips">';
    html += `<button class="chip ${!itemsSelectedCategory ? 'active' : ''}" onclick="selectCategory('')">전체</button>`;
    categories.forEach(cat => {
      html += `<button class="chip ${itemsSelectedCategory === cat ? 'active' : ''}" onclick="selectCategory('${escapeHtml(cat)}')">${escapeHtml(cat)}</button>`;
    });
    html += '</div>';
  }

  // Filter list
  const q = itemsSearchQuery.trim().toLowerCase();
  let list = state.items;

  if(q){
    list = list.filter(i => (i.name||'').toLowerCase().includes(q) || (i.category||'').toLowerCase().includes(q));
  }
  if(itemsSelectedCategory){
    list = list.filter(i => (i.category||'').trim() === itemsSelectedCategory);
  }

  list = list.slice().sort((a,b) => (a.name||'').localeCompare(b.name||''));

  // Header count
  html += `
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; font-size:12.5px; color:var(--text-muted); font-weight:600;">
    <span>총 ${list.length}개 물품</span>
    <span>대여 가능 / 총 수량</span>
  </div>
  `;

  if(state.items.length === 0){
    html += `
    <div class="empty-state">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
      </svg>
      <div style="font-weight:600; color:var(--text-main);">등록된 물품이 없습니다.</div>
      <div>아래의 물품 등록 버튼을 눌러 첫 물품을 추가해보세요.</div>
    </div>`;
  } else if(list.length === 0){
    html += `
    <div class="empty-state">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <div>검색 조건에 맞는 물품이 없습니다.</div>
    </div>`;
  } else {
    list.forEach(item => {
      const loc = getLocation(item.locationId);
      const outNow = state.transactions.filter(t => t.itemId === item.id && t.type === 'checkout' && !t.consumable && !t.returned);
      
      let statusLine = loc ? escapeHtml(loc.name) : '장소 미지정';
      if(outNow.length > 0){
        const names = outNow.map(t => (t.dept || t.person || '대여중')).join(', ');
        statusLine += ' · 대여중: ' + escapeHtml(names);
      }

      const low = item.availableQty <= 0;
      const ratio = item.totalQty > 0 ? Math.min(100, Math.round((item.availableQty / item.totalQty) * 100)) : 0;

      html += `
      <div class="item-card" onclick="openItemDetail('${item.id}')">
        <div class="item-thumb">
          ${item.photo ? `<img src="${item.photo}">` : escapeHtml((item.name||'?').slice(0,2))}
        </div>
        <div class="item-info">
          <div class="item-title-row">
            <div class="item-title">${escapeHtml(item.name)}</div>
            ${item.isDisposable ? `<span class="badge-pill soft" style="font-size:10.5px; padding:1px 6px; background:var(--amber-100); color:var(--amber-600); border-color:transparent; font-weight:700;">일회용품</span>` : ''}
            ${item.category ? `<span class="item-category-tag">${escapeHtml(item.category)}</span>` : ''}
          </div>
          <div class="item-meta">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
            <span>${statusLine}</span>
          </div>
        </div>
        <div class="item-stock-box">
          <div class="item-qty-badge ${low ? 'low' : ''}">
            ${item.availableQty} <span style="font-size:11.5px; color:var(--text-subtle); font-weight:500;">/ ${item.totalQty}</span>
          </div>
          <div class="stock-meter-bg">
            <div class="stock-meter-fill ${low ? 'low' : ''}" style="width: ${ratio}%;"></div>
          </div>
        </div>
      </div>`;
    });
  }

  // Floating Action Button
  html += `
  <button class="fab" onclick="openAddItemModal()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    <span>물품 등록</span>
  </button>
  `;

  content.innerHTML = html;
}

function onItemsSearch(v){
  itemsSearchQuery = v;
  renderItems();
}

function selectCategory(cat){
  itemsSelectedCategory = cat;
  renderItems();
}

  const lost = lostTransactions();

  // Segment Controller
  html += `

    <button class="segment-btn ${loansSegment === 'active' ? 'active' : ''}" onclick="setLoansSegment('active')">

    <button class="segment-btn ${loansSegment === 'overdue' ? 'active' : ''}" onclick="setLoansSegment('overdue')">
      연체 (${overdue.length})
    </button>
    <button class="segment-btn ${loansSegment === 'consumed' ? 'active' : ''}" onclick="setLoansSegment('consumed')">

    </button>

      분실 내역 (${lost.length})

  if(loansSegment === 'active'){

// ---------- Location Actions ----------
function openAddLocationModal(){
  openModal('새 보관 장소 추가', `
    <div style="margin-bottom:14px; font-size:13.5px; color:var(--text-muted); line-height:1.5;">
      새로운 물품 보관 장소(교실, 캐비닛, 부서실 등)를 등록합니다.
    </div>
    <div class="field">
      <label>보관 장소 이름 *</label>
      <input type="text" id="fLocModalName" placeholder="예: 2층 유치부실, 3층 음향실, 본당 1층 자모실">
    </div>
    <div class="modal-actions">
      <button class="btn secondary" style="flex:1;" onclick="closeModal()">취소</button>
      <button class="btn" style="flex:1.5;" onclick="saveNewLocationModal()">장소 추가</button>
    </div>
  `);
  setTimeout(() => {
    const input = document.getElementById('fLocModalName');
    if(input){
      input.focus();
      input.addEventListener('keydown', (e) => {
        if(e.key === 'Enter') saveNewLocationModal();
      });
    }
  }, 100);
}

async function saveNewLocationModal(){
  const input = document.getElementById('fLocModalName');
  if(!input) return;
  const name = input.value.trim();
  if(!name){
    showToast('장소 이름을 입력해주세요.');
    input.focus();
    return;
  }
  const exists = state.locations.some(l => l.name.trim().toLowerCase() === name.toLowerCase());
  if(exists){
    showToast('이미 등록된 보관 장소 이름입니다.');
    input.focus();
    return;
  }
  state.locations.push({ id: uid(), name });
  closeModal();
  await persistAndRender();
  showToast(`'${name}' 보관 장소를 추가했습니다.`);
}

async function addLocation(){
  const input = document.getElementById('newLocName');
  const name = input.value.trim();
  if(!name){ showToast('장소 이름을 입력해주세요.'); return; }
  state.locations.push({ id: uid(), name });
  await persistAndRender();
  showToast('보관 장소를 추가했습니다.');
}

async function renameLocation(id){
  const loc = getLocation(id);
  if(!loc) return;
  const name = prompt('새로운 보관 장소 이름을 입력하세요.', loc.name);
  if(!name || !name.trim()) return;
  loc.name = name.trim();
  await persistAndRender();
  showToast('장소 이름을 변경했습니다.');
}

async function deleteLocation(id){
  const count = itemCountAtLocation(id);
  if(count > 0){
    alert('이 장소에 보관 중인 물품이 있어 삭제할 수 없습니다. 먼저 물품의 보관 장소를 이동해주세요.');
    return;
  }
  if(!confirm('이 보관 장소를 삭제하시겠습니까?')) return;
  state.locations = state.locations.filter(l => l.id !== id);
  await persistAndRender();
  showToast('보관 장소를 삭제했습니다.');
}

async function onAddItemPhoto(evt){
  const file = evt.target.files[0];
  if(!file) return;
  try{
    addItemPhotoDataUrl = await fileToCompressedBase64(file, 600, 0.75);
    const zone = document.getElementById('photoZone');
    zone.innerHTML = `
      <img src="${addItemPhotoDataUrl}" alt="미리보기">
      <div>
        <label class="btn secondary" style="font-size:12px; padding:6px 12px; cursor:pointer;">
          사진 변경
          <input type="file" accept="image/*" capture="environment" class="hidden-input" onchange="onAddItemPhoto(event)">
        </label>
      </div>
    `;
  }catch(e){
    showToast('사진 처리에 실패했습니다.');
  }
}

async function saveNewItem(){
  const name = document.getElementById('fName').value.trim();
  const category = document.getElementById('fCategory').value.trim();
  const locationId = document.getElementById('fLocation').value;
  const qty = parseInt(document.getElementById('fQty').value, 10);
  const isDisposable = !!document.getElementById('fIsDisposable').checked;
  if(!name){ showToast('물품 이름을 입력해주세요.'); return; }
  if(!qty || qty < 1){ showToast('수량을 정확히 입력해주세요.'); return; }
  state.items.push({
    id: uid(), name, category, locationId,
    totalQty: qty, availableQty: qty,
    isDisposable,
    photo: addItemPhotoDataUrl || null,
    createdAt: new Date().toISOString()
  });
  closeModal();
  await persistAndRender();
  showToast('물품을 등록했습니다.');
}

      let label;

        label = `<span style="color:var(--rose-600); font-weight:600;">[분실] ${escapeHtml(t.dept || '')} ${t.person ? '· ' + escapeHtml(t.person) : ''} · ${t.qty}개 분실</span>`;

          <div>

              ${escapeHtml(t.dept || '부서 미입력')} · ${escapeHtml(t.person || '담당자')} (${t.qty}개)
            </div>
            <div style="font-size:11.5px; color:var(--text-muted); margin-top:2px;">
              반납 예정일: ${fmtDate(t.dueDate)}
            </div>
          </div>
          <div style="display:flex; gap:6px; flex-shrink:0;">
            <button class="action-pill-btn" style="padding:3px 8px; font-size:11.5px;" onclick="returnLoan('${t.id}')">반납</button>

          ${item.availableQty > 0 ? `

      ${historyHtml}
    </div>

}

// 남아 있는 물품(가용 재고) 개별 삭제
async function deleteAvailableStock(itemId){
  const item = getItem(itemId);
  if(!item || item.availableQty <= 0){
    showToast('삭제할 남아 있는 물품이 없습니다.');
    return;
  }
  const qtyToDelete = item.availableQty;
  if(!confirm(`현재 보관 중인 남아 있는 물품 ${qtyToDelete}개를 삭제하시겠습니까?\n(대여 중인 물품은 그대로 유지됩니다)`)) return;

  item.totalQty = Math.max(0, item.totalQty - qtyToDelete);
  item.availableQty = 0;

  // 만약 대여 중인 물품도 없다면 물품 자체 삭제 처리
  const hasActiveLoan = state.transactions.some(t => t.itemId === itemId && t.type === 'checkout' && !t.consumable && !t.returned);
  if(!hasActiveLoan && item.totalQty <= 0){
    state.items = state.items.filter(i => i.id !== itemId);
    state.transactions = state.transactions.filter(t => t.itemId !== itemId);
    closeModal();
    await persistAndRender();
    showToast('남아 있는 물품 및 물품 정보가 삭제되었습니다.');
    return;
  }

  await persistAndRender();
  openItemDetail(itemId);
  showToast(`남아 있는 물품 ${qtyToDelete}개를 삭제했습니다.`);
}

async function confirmDeleteLoan(transactionId, mode){
  const t = state.transactions.find(x => x.id === transactionId);
  if(!t) return;
  const item = getItem(t.itemId);

  if(mode === 'permanent'){
    if(item){
      item.totalQty = Math.max(0, item.totalQty - t.qty);
    }
    state.transactions = state.transactions.filter(x => x.id !== transactionId);
    closeModal();
    await persistAndRender();
    showToast('대여 물품을 영구 삭제(총 수량 차감)했습니다.');
  } else if(mode === 'cancel'){
    if(item){
      item.availableQty += t.qty;
    }
    state.transactions = state.transactions.filter(x => x.id !== transactionId);
    closeModal();
    await persistAndRender();
    showToast('대여 등록을 취소하고 재고로 복구했습니다.');
  }
}

  const item = getItem(itemId);
  if(!item) return;
  const hasActiveLoan = state.transactions.some(t => t.itemId === itemId && t.type === 'checkout' && !t.consumable && !t.returned);

  state.transactions = state.transactions.filter(t => t.itemId !== itemId);

async function saveEditItem(itemId){
  const item = getItem(itemId);
  if(!item) return;
  const name = document.getElementById('eName').value.trim();
  const category = document.getElementById('eCategory').value.trim();
  const locationId = document.getElementById('eLocation').value;
  const newTotal = parseInt(document.getElementById('eQty').value, 10);
  const isDisposable = !!document.getElementById('eIsDisposable').checked;
  if(!name){ showToast('물품 이름을 입력해주세요.'); return; }
  const delta = newTotal - item.totalQty;
  item.name = name;
  item.category = category;
  item.locationId = locationId;
  item.totalQty = newTotal;
  item.availableQty = Math.max(0, item.availableQty + delta);
  item.isDisposable = isDisposable;
  closeModal();
  await persistAndRender();
  showToast('물품 정보를 수정했습니다.');
}

// ---------- Checkout (대여/사용) Modal ----------
function openCheckoutModal(itemId){
  let itemSelectHtml = '';
  let isDisposable = false;

  if(itemId){
    const item = getItem(itemId);
    if(item) isDisposable = !!item.isDisposable;
    itemSelectHtml = `
      <div class="field">
        <label>대여 물품 *</label>
        <input type="text" value="${escapeHtml(item ? item.name : '')} ${isDisposable ? '[일회용품]' : ''} (대여가능: ${item ? item.availableQty : 0}개)" disabled>
        <input type="hidden" id="coItemId" value="${itemId}">
      </div>`;
  } else {
    const availableItems = state.items.filter(i => i.availableQty > 0);
    if(availableItems.length === 0){
      alert('현재 대여하거나 사용할 수 있는 물품이 없습니다.');
      return;
    }
    isDisposable = !!availableItems[0].isDisposable;
    const options = availableItems.map(i => 
      `<option value="${i.id}">${escapeHtml(i.name)} ${i.isDisposable ? '[일회용품]' : ''} (대여가능: ${i.availableQty}개)</option>`
    ).join('');

    itemSelectHtml = `
      <div class="field">
        <label>대여할 물품 선택 *</label>
        <select id="coItemId" onchange="onCheckoutItemChanged(this.value)">${options}</select>
      </div>`;
  }

  // Default dates: pickup today, return due 7 days later
  const today = todayStr();
  const nextWeek = new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10);

  openModal('대여 / 사용 등록', `
    ${itemSelectHtml}
    <div class="field">
      <label>수량 *</label>
      <input type="number" id="coQty" min="1" value="1">
    </div>
    <div class="field">
      <label>사용 부서 *</label>
      <input type="text" id="coDept" placeholder="예: 영아팀, 유아팀, 유치팀, 통미팀, 초등1팀 등">
    </div>
    <div class="field">
      <label>담당자 성명 *</label>
      <input type="text" id="coPerson" placeholder="예: 김철수 선생님">
    </div>
    <div class="field">
      <label class="checkline">
        <input type="checkbox" id="coConsumable" ${isDisposable ? 'checked' : ''} onchange="toggleDueDate()">
        <span>소모성 물품 (행사 사용 등으로 반납하지 않음)${isDisposable ? ' <strong style="color:var(--amber-600); font-size:12px;">(일회용품 기본 적용)</strong>' : ''}</span>
      </label>
    </div>
    <div class="field" id="pickupDateField">
      <label>픽업 예정일 *</label>
      <input type="date" id="coPickupDate" value="${today}" onchange="onPickupDateChanged()">
    </div>
    <div class="field" id="dueDateField">
      <label>반납 예정일 *</label>
      <input type="date" id="coDueDate" value="${nextWeek}">
    </div>
    <div class="modal-actions">
      <button class="btn secondary" style="flex:1;" onclick="closeModal()">취소</button>
      <button class="btn" style="flex:1.5;" onclick="confirmCheckout()">등록 완료</button>
    </div>
  `);

  // 일회용품인 경우 반납일 필드 초기 숨김 처리
  if(isDisposable){
    toggleDueDate();
  }
}

function onCheckoutItemChanged(selItemId){
  const item = getItem(selItemId);
  if(!item) return;
  const cb = document.getElementById('coConsumable');
  if(cb){
    cb.checked = !!item.isDisposable;
    toggleDueDate();
  }
}

function onPickupDateChanged(){
  const pVal = document.getElementById('coPickupDate').value;
  const dInput = document.getElementById('coDueDate');
  if(!pVal || !dInput) return;
  if(!dInput.value || dInput.value <= pVal){
    const nextWeek = new Date(new Date(pVal).getTime() + 7 * 86400000).toISOString().slice(0, 10);
    dInput.value = nextWeek;
  }
}

function toggleDueDate(){
  const checked = document.getElementById('coConsumable').checked;
  document.getElementById('dueDateField').style.display = checked ? 'none' : 'block';
}

async function confirmCheckout(){
  const itemId = document.getElementById('coItemId').value;
  const item = getItem(itemId);
  if(!itemId || !item){ showToast('대여할 물품을 선택해주세요.'); return; }
  const qty = parseInt(document.getElementById('coQty').value, 10);
  const dept = document.getElementById('coDept').value.trim();
  const person = document.getElementById('coPerson').value.trim();
  const consumable = document.getElementById('coConsumable').checked;
  const pickupDate = document.getElementById('coPickupDate').value || todayStr();
  const dueDate = consumable ? null : document.getElementById('coDueDate').value;

  if(!qty || qty < 1){ showToast('대여 수량을 정확히 입력해주세요.'); return; }
  if(qty > item.availableQty){ showToast('가용 수량(' + item.availableQty + '개)을 초과했습니다.'); return; }
  if(!dept){ showToast('사용 부서를 입력해주세요.'); return; }
  if(!person){ showToast('담당자 성명을 입력해주세요.'); return; }
  if(!pickupDate){ showToast('픽업 예정일을 입력해주세요.'); return; }
  if(!consumable && !dueDate){ showToast('반납 예정일을 입력해주세요.'); return; }
  if(!consumable && dueDate && pickupDate && dueDate < pickupDate){
    showToast('반납 예정일은 픽업 예정일 이후여야 합니다.');
    return;
  }

  item.availableQty -= qty;
  if(consumable) item.totalQty -= qty;

  state.transactions.push({
    id: uid(), itemId, type: 'checkout', qty, dept, person,
    pickupDate, dueDate, consumable, returned: consumable,
    returnedAt: consumable ? new Date().toISOString() : null,
    createdAt: new Date().toISOString()
  });

  closeModal();
  await persistAndRender();
  showToast(consumable ? '소모 처리를 완료했습니다.' : '대여 등록을 완료했습니다.');
}

async function returnLoan(transactionId){
  const t = state.transactions.find(x => x.id === transactionId);
  if(!t) return;
  const item = getItem(t.itemId);
  if(item) item.availableQty += t.qty;
  t.returned = true;
  t.returnedAt = new Date().toISOString();
  await persistAndRender();
  showToast('반납 처리를 완료했습니다.');
}

// ---------- Report Lost (분실 신고 및 관리) ----------
function openReportLostModal(loanId){
  let targetHtml = '';
  let maxQty = 1;
  let defaultItem = null;
  let defaultLoan = null;

  if(loanId){
    defaultLoan = state.transactions.find(x => x.id === loanId);
    if(defaultLoan){
      defaultItem = getItem(defaultLoan.itemId);
      maxQty = defaultLoan.qty;
    }
  }

  if(defaultLoan && defaultItem){
    targetHtml = `
      <div class="field">
        <label>분실 대상 대여 물품</label>
        <div style="background:var(--surface-alt); border:1px solid var(--line); border-radius:var(--radius-md); padding:10px 14px;">
          <div style="font-weight:700; color:var(--text-main); font-size:14px;">${escapeHtml(defaultItem.name)}</div>
          <div style="font-size:12.5px; color:var(--text-muted); margin-top:4px;">
            대여 부서: <strong>${escapeHtml(defaultLoan.dept || '부서 미입력')}</strong> · 담당자: <strong>${escapeHtml(defaultLoan.person || '담당자 미입력')}</strong>
          </div>
          <div style="font-size:12px; color:var(--primary-700); font-weight:600; margin-top:2px;">
            현재 대여 수량: ${defaultLoan.qty}개
          </div>
        </div>
        <input type="hidden" id="lostLoanId" value="${defaultLoan.id}">
        <input type="hidden" id="lostItemId" value="${defaultItem.id}">
      </div>
    `;
  } else {
    const loans = activeLoans();
    let optionsHtml = '';

    if(loans.length > 0){
      optionsHtml += '<optgroup label="현재 대여 중인 물품">';
      loans.forEach(l => {
        const it = getItem(l.itemId);
        if(it){
          optionsHtml += `<option value="loan:${l.id}:${it.id}:${l.qty}">[대여중] ${escapeHtml(it.name)} (${escapeHtml(l.dept || '부서')} / ${escapeHtml(l.person || '담당')} - ${l.qty}개)</option>`;
        }
      });
      optionsHtml += '</optgroup>';
    }

    const availItems = state.items.filter(i => i.availableQty > 0);
    if(availItems.length > 0){
      optionsHtml += '<optgroup label="보관 중인 물품 (대여 외 분실)">';
      availItems.forEach(i => {
        const loc = getLocation(i.locationId);
        optionsHtml += `<option value="item:${i.id}:${i.availableQty}">[보관중] ${escapeHtml(i.name)} (${loc ? escapeHtml(loc.name) : '장소미지정'} - 재고 ${i.availableQty}개)</option>`;
      });
      optionsHtml += '</optgroup>';
    }

    if(!optionsHtml){
      alert('분실 처리할 수 있는 대여 물품이나 재고가 없습니다.');
      return;
    }

    targetHtml = `
      <div class="field">
        <label>분실 물품 선택 *</label>
        <select id="lostSelectTarget" onchange="onLostTargetChanged(this.value)">
          ${optionsHtml}
        </select>
        <input type="hidden" id="lostLoanId" value="">
        <input type="hidden" id="lostItemId" value="">
      </div>
      <div class="field" id="lostDeptField" style="display:none;">
        <label>분실 부서/장소</label>
        <input type="text" id="lostDept" placeholder="예: 중고등부실, 유아부, 대예배실">
      </div>
    `;
  }

  const defaultReporter = defaultLoan ? (defaultLoan.person || '') : '';

  openModal('물품 분실 신고', `
    ${targetHtml}
    <div class="field">
      <label>분실 수량 *</label>
      <input type="number" id="lostQty" min="1" max="${maxQty}" value="${maxQty}">
      <div id="lostQtyNotice" style="font-size:12px; color:var(--text-muted); margin-top:4px;">
        ${defaultLoan ? `전체 대여 수량 ${defaultLoan.qty}개 중 분실된 수량을 입력하세요.` : ''}
      </div>
    </div>
    <div class="field">
      <label>분실 경위 및 사유</label>
      <input type="text" id="lostReason" placeholder="예: 행사 야외 활동 중 분실, 부서 보관 중 분실 확인">
    </div>
    <div class="field">
      <label>신고 / 확인 담당자</label>
      <input type="text" id="lostReporter" value="${escapeHtml(defaultReporter)}" placeholder="예: 담당 교사 성명">
    </div>
    <div class="field">
      <label>분실 확인일</label>
      <input type="date" id="lostDate" value="${todayStr()}">
    </div>

    <div style="background:var(--rose-50); border:1px solid rgba(225, 29, 72, 0.2); border-radius:var(--radius-md); padding:10px 14px; margin-top:14px; font-size:12px; color:var(--rose-700); line-height:1.5;">
      <strong>⚠️ 분실 처리 시 재고 안내</strong><br>
      분실 신고 시 해당 물품의 <strong>총 보유 수량(재고)이 차감</strong>됩니다. 나중에 물품을 다시 찾으시면 언제든 <strong>[분실 내역]</strong> 탭에서 <strong>[재고 복구]</strong>를 누를 수 있습니다.
    </div>

    <div class="modal-actions" style="margin-top:18px;">
      <button class="btn secondary" style="flex:1;" onclick="closeModal()">취소</button>
      <button class="btn danger" style="flex:1.5; background:var(--rose-600); border-color:var(--rose-600); color:#fff;" onclick="confirmReportLost()">분실 신고 완료</button>
    </div>
  `);

  if(!defaultLoan){
    const sel = document.getElementById('lostSelectTarget');
    if(sel) onLostTargetChanged(sel.value);
  }
}

function onLostTargetChanged(val){
  if(!val) return;
  const parts = val.split(':');
  const type = parts[0];
  const loanIdEl = document.getElementById('lostLoanId');
  const itemIdEl = document.getElementById('lostItemId');
  const qtyEl = document.getElementById('lostQty');
  const noticeEl = document.getElementById('lostQtyNotice');
  const deptField = document.getElementById('lostDeptField');

  if(type === 'loan'){
    const loanId = parts[1];
    const itemId = parts[2];
    const qty = parseInt(parts[3], 10);
    loanIdEl.value = loanId;
    itemIdEl.value = itemId;
    qtyEl.max = qty;
    qtyEl.value = qty;
    if(noticeEl) noticeEl.textContent = `전체 대여 수량 ${qty}개 중 분실된 수량을 입력하세요.`;
    if(deptField) deptField.style.display = 'none';

    const loan = state.transactions.find(x => x.id === loanId);
    if(loan && document.getElementById('lostReporter')){
      document.getElementById('lostReporter').value = loan.person || '';
    }
  } else if(type === 'item'){
    const itemId = parts[1];
    const qty = parseInt(parts[2], 10);
    loanIdEl.value = '';
    itemIdEl.value = itemId;
    qtyEl.max = qty;
    qtyEl.value = 1;
    if(noticeEl) noticeEl.textContent = `보관 가용 재고 ${qty}개 중 분실 수량을 입력하세요.`;
    if(deptField) deptField.style.display = 'block';
  }
}

async function confirmReportLost(){
  const loanId = document.getElementById('lostLoanId')?.value;
  const itemId = document.getElementById('lostItemId')?.value;
  const lostQty = parseInt(document.getElementById('lostQty').value, 10);
  const reason = document.getElementById('lostReason').value.trim();
  const reporter = document.getElementById('lostReporter').value.trim();
  const lostDate = document.getElementById('lostDate').value || todayStr();

  if(!itemId){
    showToast('분실 대상 물품을 선택해주세요.');
    return;
  }
  const item = getItem(itemId);
  if(!item){
    showToast('물품을 찾을 수 없습니다.');
    return;
  }
  if(!lostQty || lostQty < 1){
    showToast('분실 수량을 1개 이상 입력해주세요.');
    return;
  }

  if(loanId){
    const loan = state.transactions.find(x => x.id === loanId);
    if(!loan){ showToast('대여 내역을 찾을 수 없습니다.'); return; }
    if(lostQty > loan.qty){
      showToast(`분실 수량은 대여 수량(${loan.qty}개)을 초과할 수 없습니다.`);
      return;
    }

    item.totalQty = Math.max(0, item.totalQty - lostQty);
    item.availableQty = Math.min(item.availableQty, item.totalQty);

    if(lostQty === loan.qty){
      loan.returned = true;
      loan.isLost = true;
      loan.lostAt = lostDate;
      loan.lostReason = reason;
      loan.lostReporter = reporter || loan.person;
    } else {
      loan.qty -= lostQty;
    }

    state.transactions.push({
      id: uid(),
      itemId: item.id,
      type: 'lost',
      qty: lostQty,
      dept: loan.dept || '',
      person: reporter || loan.person || '',
      reason: reason || '대여 중 분실',
      date: lostDate,
      loanId: loan.id,
      createdAt: new Date().toISOString()
    });
  } else {
    if(lostQty > item.availableQty){
      showToast(`분실 수량이 가용 재고(${item.availableQty}개)를 초과할 수 없습니다.`);
      return;
    }
    const dept = document.getElementById('lostDept')?.value.trim() || '';
    item.totalQty = Math.max(0, item.totalQty - lostQty);
    item.availableQty = Math.max(0, item.availableQty - lostQty);

    state.transactions.push({
      id: uid(),
      itemId: item.id,
      type: 'lost',
      qty: lostQty,
      dept: dept,
      person: reporter,
      reason: reason || '보관 중 분실',
      date: lostDate,
      createdAt: new Date().toISOString()
    });
  }

  closeModal();
  await persistAndRender();
  showToast('분실 신고 처리가 완료되었습니다.');
}

async function restoreLostItem(transactionId){
  const t = state.transactions.find(x => x.id === transactionId);
  if(!t) return;
  const item = getItem(t.itemId);
  const itemName = item ? item.name : '해당 물품';

  if(!confirm(`[${itemName}] ${t.qty}개의 분실 처리를 취소하고, 재고로 다시 복구하시겠습니까?`)){
    return;
  }

  if(item){
    item.totalQty += t.qty;
    item.availableQty += t.qty;
  }

  state.transactions = state.transactions.filter(x => x.id !== transactionId);

  if(t.loanId){
    const loan = state.transactions.find(x => x.id === t.loanId);
    if(loan && loan.isLost){
      loan.returned = true;
      loan.returnedAt = new Date().toISOString();
      delete loan.isLost;
    }
  }

  await persistAndRender();
  showToast('재고가 정상적으로 복구되었습니다.');
}
